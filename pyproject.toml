[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trombinoscope"
version = "0.2.1"
description = "Génère un trombinoscope PDF prêt à imprimer depuis un dossier de photos brutes et une liste de personnes."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "antnardo", email = "antnardo@users.noreply.github.com" }]
keywords = [
    "trombinoscope",
    "yearbook",
    "face-detection",
    "portrait",
    "pdf",
    "reportlab",
    "opencv",
    "white-balance",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: French",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics :: Capture",
    "Topic :: Printing",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    # Variante « headless » : aucune dépendance GUI (libGL, GTK), donc installable
    # en conteneur et en CI. Le paquet n'appelle jamais cv2.imshow. Si vous avez
    # déjà `opencv-python` dans l'environnement, installez avec --no-deps pour
    # éviter que les deux distributions ne se disputent le module `cv2`.
    "opencv-python-headless>=4.8",
    "pillow>=10.0",
    "reportlab>=4.0",
    # Couche de mise en page au-dessus de reportlab : curseur, ancrages
    # typographiques, texte pivoté. Les corrections de mise en page se font là
    # plutôt qu'en double ici.
    "reportlab-layout>=1.1.0",
]

[project.optional-dependencies]
heic = ["pillow-heif>=0.15"]

[project.urls]
Homepage = "https://github.com/antnardo/trombinoscope"
Documentation = "https://github.com/antnardo/trombinoscope/blob/main/docs/DOC.md"
Repository = "https://github.com/antnardo/trombinoscope"
Issues = "https://github.com/antnardo/trombinoscope/issues"
Changelog = "https://github.com/antnardo/trombinoscope/blob/main/CHANGELOG.md"

[project.scripts]
trombinoscope = "trombinoscope.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pypdf>=4.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/trombinoscope"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/scripts",
    "/examples",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/CREDITS.md",
]
# Ceinture et bretelles : le .gitignore exclut déjà ce dossier, mais une
# distribution ne doit en aucun cas embarquer de photographie.
exclude = ["/tests/data/portraits"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "N", "C4", "PTH", "RET"]
ignore = ["RUF001", "RUF002", "RUF003"]  # ambiguïtés unicode : les docstrings sont en français

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SIM117"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: tests lents (détection réelle sur photos)",
    "integration: bout-en-bout, nécessite les images de test",
]

[tool.coverage.run]
source = ["src/trombinoscope"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
